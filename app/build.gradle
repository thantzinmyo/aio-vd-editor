plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

apply plugin: 'com.mikepenz.aboutlibraries.plugin'

aboutLibraries {
    excludeFields = ["generated"]
}

android {
    namespace 'com.tharunbirla.librecuts'
    // compileSdk 35 (not 36): Media3 1.10+ needs 36, and this project's
    // AGP 8.7.1 supports at most 35. targetSdk stays 34, so runtime
    // behaviour is unchanged — compileSdk only decides which APIs the
    // code may reference.
    compileSdk 35

    androidResources {
        generateLocaleConfig = true
    }

    lint {
        disable 'UseAppTint', 'MissingTranslation', 'ExtraTranslation'
    }

    defaultConfig {
        applicationId "com.tharunbirla.librecuts"
        minSdk 26
        targetSdk 34
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 10
        versionName "1.0-beta7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }

    applicationVariants.all { variant ->
        def abiCodes = ['armeabi-v7a': 0, 'arm64-v8a': 1, 'x86_64': 2]

        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null && abiCodes.containsKey(abi)) {
                output.versionCodeOverride = variant.versionCode + abiCodes.get(abi)
            }
        }
    }
}

dependencies {
    // GPU export pipeline + preview player: Media3 (Transformer for
    // export, ExoPlayer for the live preview) — one stack. 1.9.0 is
    // the newest Media3 that works here: 1.10+ needs compileSdk 36,
    // and this project's AGP 8.7.1 supports at most 35. 1.9.0 already
    // has everything used (setSpeed, setFrameRate, MergingMediaSource,
    // FilteringMediaSource — verified against the 1.9.0 AARs). The old
    // ExoPlayer 2.19.1 preview player was migrated to Media3 in the
    // same change (PlayerView replaces StyledPlayerView).
    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-ui:1.9.0'
    implementation 'androidx.media3:media3-transformer:1.9.0'
    implementation 'androidx.media3:media3-effect:1.9.0'
    implementation("com.antonkarpenko:ffmpeg-kit-full-gpl:2.1.0")
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.airbnb.android:lottie:3.4.0'
    implementation "com.mikepenz:aboutlibraries-core:11.2.3"
    implementation "com.mikepenz:aboutlibraries:11.2.3"
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation 'com.google.code.gson:gson:2.10.1'
}
